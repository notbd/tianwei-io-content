name: Deploy Content to Neon

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'drizzle/**'
      - 'src/**'
      - 'scripts/**'
      - drizzle.config.ts
      - .github/workflows/deploy-content.yml
      - package.json
      - pnpm-lock.yaml
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Two overlapping deploys must never interleave their reconciles.
concurrency:
  group: deploy-content
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    runs-on: ubuntu-latest
    needs: checks
    env:
      DATABASE_URL: ${{ secrets.PROD_REMOTE_DATABASE_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to Neon
        run: pnpm db:migrate

      - name: Sync content (transactional reconcile)
        run: pnpm sync:prod

      - name: Revalidate frontend cache
        run: pnpm frontend:revalidate
